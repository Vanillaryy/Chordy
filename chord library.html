<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chord Library | Chordy : Guitar Chord for Beginners</title>
	<link rel="stylesheet" href="index_css.css">
	<link rel="stylesheet" href="chord library.css">
</head>

<body>
	<header>
		<div class="header-inner">
			<h1 style="color: #3E2723;">Chordy</h1>
			<nav>
				<a href="index.html">Home</a>
				<a href="guide.html">Guide</a>
				<a href="chord library.html">Chord Library</a>
				<a href="contact.html">Contact</a>
			</nav>
		</div>
	</header>

	<section class="hero">
		<h2 style="color: #3E2723;">Chord Library</h2>
		<p>Select the chord you are looking for.</p>
	</section>

	<div class="selector-container">
		<select id="root">
			<option value="">Select Root</option>
			<option>C</option>
			<option>C# (Db)</option>
			<option>D</option>
			<option>D# (Eb)</option>
			<option>E</option>
			<option>F</option>
			<option>F# (Gb)</option>
			<option>G</option>
			<option>G# (Ab)</option>
			<option>A</option>
			<option>A# (Bb)</option>
			<option>B</option>
		</select>

		<select id="quality">
			<option value="">Select Quality</option>
			<option>Major</option>
			<option>Minor</option>
			<option>Dim</option>
			<option>Aug</option>
		</select>

		<select id="extension">
			<option value="">Select Extension</option>
			<option>None</option>
			<!-- <option>6</option>
			<option>7</option>
			<option>Maj7</option>
			<option>add9</option>
			<option>9</option>
			<option>11</option>
			<option>13</option> -->
		</select>

		<button onclick="showChord()">Find Chord</button>
	</div>

	<div class="result" id="result">
		<p>Result Chord</p>
	</div>

	<footer>
		<p>&copy; 2025 Chordy : Guitar Chord for Beginners</p>
	</footer>

	<script src="chord library.js"></script>
</body>

</html>
