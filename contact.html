<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact | Chordy : Guitar Chord for Beginners</title>
	<link rel="stylesheet" href="index_css.css">
	<style>
		.contact-form {
			max-width: 500px;
			margin: 40px auto;
			padding: 20px;
			background: #fdf6ef;
			border-radius: 10px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
		}

		.contact-form label {
			display: block;
			margin-top: 15px;
			font-weight: bold;
		}

		.contact-form input,
		.contact-form textarea {
			width: 90%;
			padding: 10px;
			margin-top: 5px;
			border-radius: 6px;
			border: 1px solid #ccc;
			font-size: 16px;
		}

		.contact-form textarea {
			resize: none;
		}

		.contact-form button {
			margin-top: 20px;
			width: 100%;
		}
	</style>
</head>

<body>
	<header>
		<div class="header-inner">
			<h1 style="color: #3E2723;">Chordy</h1>
			<nav>
				<a href="index.html">Home</a>
				<a href="guide.html">Guide</a>
				<a href="chord library.html">Chord Library</a>
				<a href="contact.html">Contact</a>
			</nav>
		</div>
	</header>

	<section class="hero">
		<h2 style="color: #3E2723;">Contact Us</h2>
	</section>

	<div class="contact-form">
		<form action="submit" method="post">
			<label for="name">Name</label>
			<input type="text" id="name" name="name" placeholder="Your name" required>

			<label for="email">Email</label>
			<input type="email" id="email" name="email" placeholder="Your email" required>

			<label for="message">Message</label>
			<textarea id="message" name="message" rows="6" placeholder="Type your message here" required></textarea>

			<button type="submit">Send Message</button>
		</form>
	</div>

	<footer>
		<p>&copy; 2025 Chordy : Guitar Chord for Beginners</p>
	</footer>
</body>

</html>
